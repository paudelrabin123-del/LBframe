<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>LightBridge Frame Scanner</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 16px 40px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:15px;margin:11px 0}h1{font-size:25px}.sub,.status{color:#64748b;font-size:13px}button,input{font:inherit}button{border:0;border-radius:12px;min-height:48px;padding:0 15px;font-weight:750}.primary{background:#0f172a;color:#fff;width:100%}.secondary{background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px}.row>*{flex:1}input{width:100%;height:48px;border:1px solid #cbd5e1;border-radius:12px;padding:0 12px;font-size:17px}.label{font-size:12px;color:#64748b;font-weight:700}.big{font-size:28px;font-weight:850;margin:4px 0}.brand{font-size:14px;font-weight:800;color:#475569;text-transform:uppercase}.pill{display:inline-block;background:#f1f5f9;border-radius:999px;padding:6px 9px;margin:4px 5px 0 0;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{background:#f8fafc;border-radius:13px;padding:11px}.metric .v{font-size:20px;font-weight:800}.ok{color:#047857}.bad{color:#b91c1c}.hidden{display:none}#reader{border-radius:14px;overflow:hidden;margin-top:10px}.scanitem{border-top:1px solid #e2e8f0;padding:9px 0}.scanhead{display:flex;justify-content:space-between}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><div class="wrap"><h1>LightBridge Frame Scanner</h1><p class="sub" id="loaded">Loading validated inventory…</p><div class="card"><button id="scanBtn" class="primary">📷 Scan Barcode</button><div id="readerWrap" class="hidden"><div id="reader"></div></div><p id="scanStatus" class="status">Only barcodes present in the validated invoice-price table can be counted.</p></div><div class="card"><div class="label">MANUAL BARCODE LOOKUP</div><div class="row"><input id="manual" inputmode="numeric" placeholder="Scan or type barcode"><button id="lookupBtn" class="secondary">Find</button></div></div><div id="result" class="card hidden"><div id="foundState" class="brand"></div><div id="brand" class="brand"></div><div id="model" class="big"></div><div><span id="type" class="pill"></span><span id="color" class="pill"></span></div><div class="grid"><div class="metric"><div class="label">INVOICE UNIT PRICE</div><div id="cost" class="v">—</div></div><div class="metric"><div class="label">MSRP</div><div id="msrp" class="v">—</div></div><div class="metric"><div class="label">SCANNED</div><div id="qty" class="v">0</div></div></div><p id="formula" class="status"></p><p id="barcodeLine" class="status"></p><button id="addBtn" class="primary">Add to Physical Count</button></div><div class="card"><div class="scanhead"><div><div class="label">PHYSICAL COUNT</div><div class="big"><span id="totalScans">0</span> scans</div></div><div><div class="label">UNIQUE</div><div class="big" id="uniqueScans">0</div></div></div><div id="recent" class="status">No frames scanned yet.</div><div class="toolbar"><button id="exportBtn" class="secondary">Export Count CSV</button><button id="clearBtn" class="danger">Clear Count</button></div></div></div><script>
const DETAILS='data/lightbridge_safilo_inventory_with_frame_details.csv',PRICES='inventory.csv';let inventory=new Map(),current=null,scanner=null,running=false,count=JSON.parse(localStorage.getItem('lb-frame-count-v2')||'{}');const $=id=>document.getElementById(id),clean=v=>String(v||'').replace(/[^0-9]/g,'').trim();
function csv(t){let R=[],r=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(q){if(c==='"'&&n==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f.replace(/\r$/,''));R.push(r);r=[];f=''}else f+=c}if(f||r.length){r.push(f);R.push(r)}return R}
async function load(){try{let[pr,dr]=await Promise.all([fetch(PRICES+'?v='+Date.now()),fetch(DETAILS+'?v='+Date.now())]),P=csv(await pr.text()),D=csv(await dr.text()),ph=P.shift().map(x=>x.trim()),dh=D.shift().map(x=>x.trim()),pi=n=>ph.indexOf(n),di=n=>dh.indexOf(n),detail=new Map();for(const a of D){let b=clean(a[di('Barcode Number')]);if(b)detail.set(b,a)}for(const a of P){let b=clean(a[pi('code')]),u=Number(a[pi('unitPrice')]);if(!b||!Number.isFinite(u))continue;let cat=a[pi('category')]||'',mult=cat==='Sunglasses'?2.75:3,d=detail.get(b),x={barcode:b,type:cat,cost:u,mult,msrp:Number((u*mult).toFixed(2)),brand:'',model:'',color:''};if(d){x.brand=d[di('Brand')]||'';x.model=d[di('Frame Name')]||'';x.color=d[di('Color')]||''}inventory.set(b,x)}$('loaded').textContent=inventory.size+' validated items · invoice Unit Price only';renderCount()}catch(e){$('loaded').textContent='Inventory failed to load';$('loaded').className='bad'}}
function show(x,b){current=x||null;$('result').classList.remove('hidden');$('foundState').textContent=x?'✓ VALIDATED INVENTORY ITEM':'⚠ BARCODE NOT IN VALIDATED TABLE';$('foundState').className='brand '+(x?'ok':'bad');$('brand').textContent=x?.brand||'';$('model').textContent=x?.model||(x?'Verified barcode':'Not found');$('type').textContent=x?.type||'Not validated';$('color').textContent=x?.color||'';$('cost').textContent=x?'$'+x.cost.toFixed(2):'—';$('msrp').textContent=x?'$'+x.msrp.toFixed(2):'—';$('qty').textContent=x?(count[b]?.qty||0):0;$('formula').textContent=x?'$'+x.cost.toFixed(2)+' × '+x.mult.toFixed(2)+' = $'+x.msrp.toFixed(2):'This barcode will NOT be added. Verify it against the source document first.';$('barcodeLine').textContent='Barcode: '+b;$('addBtn').disabled=!x;$('addBtn').style.opacity=x?'1':'.4'}
function lookup(v,add=false){let b=clean(v);if(!b)return,x=inventory.get(b);$('manual').value=b;show(x,b);if(add&&x)addCurrent()}
function addCurrent(){if(!current)return;let b=current.barcode;if(!count[b])count[b]={qty:0,...current};count[b].qty++;localStorage.setItem('lb-frame-count-v2',JSON.stringify(count));$('qty').textContent=count[b].qty;renderCount()}
function renderCount(){let E=Object.entries(count),t=E.reduce((s,[,v])=>s+Number(v.qty||0),0);$('totalScans').textContent=t;$('uniqueScans').textContent=E.length;$('recent').innerHTML=E.length?E.slice(-8).reverse().map(([b,v])=>'<div class="scanitem"><div class="scanhead"><b>'+((v.brand+' '+v.model).trim()||b)+'</b><b>× '+v.qty+'</b></div><div class="status">'+b+'</div></div>').join(''):'No frames scanned yet.'}
async function toggle(){if(running){try{await scanner.stop()}catch(e){}running=false;$('readerWrap').classList.add('hidden');$('scanBtn').textContent='📷 Scan Barcode';return}$('readerWrap').classList.remove('hidden');scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:150}},d=>{lookup(d,true);$('scanStatus').textContent=inventory.has(clean(d))?'Validated scan added.':'Barcode not validated — not added.'},()=>{});running=true;$('scanBtn').textContent='Stop Camera'}catch(e){$('scanStatus').textContent='Camera could not start. Check Safari camera permission.'}}
function exportCSV(){let L=[['Barcode Number','Brand','Frame Name','Color','Type','Invoice Unit Price','MSRP Price','Physical Qty']];for(const[b,v]of Object.entries(count))L.push([b,v.brand,v.model,v.color,v.type,v.cost,v.msrp,v.qty]);let s=L.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='lightbridge_validated_physical_count.csv';a.click()}
$('scanBtn').onclick=toggle;$('lookupBtn').onclick=()=>lookup($('manual').value);$('manual').onkeydown=e=>{if(e.key==='Enter')lookup(e.target.value)};$('addBtn').onclick=addCurrent;$('exportBtn').onclick=exportCSV;$('clearBtn').onclick=()=>{if(confirm('Clear physical count?')){count={};localStorage.removeItem('lb-frame-count-v2');renderCount()}};load();
</script></body></html>
