<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>LightBridge Frame Scanner</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:15px;margin:11px 0}button,input{font:inherit}button{border:0;border-radius:12px;min-height:50px;padding:0 15px;font-weight:750}.primary{background:#0f172a;color:#fff;width:100%}.secondary{background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px}.row>*{flex:1}input{width:100%;height:50px;border:1px solid #cbd5e1;border-radius:12px;padding:0 12px;font-size:17px}.label,.status{font-size:12px;color:#64748b}.big{font-size:27px;font-weight:850;margin:4px 0}.brand{font-weight:800;color:#475569;text-transform:uppercase}.pill{display:inline-block;background:#f1f5f9;border-radius:999px;padding:6px 9px;margin:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{background:#f8fafc;border-radius:13px;padding:11px}.v{font-size:20px;font-weight:800}.ok{color:#047857}.bad{color:#b91c1c}.hidden{display:none}#reader{margin-top:10px;overflow:hidden;border-radius:14px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.row,.toolbar{grid-template-columns:1fr;display:grid}}</style></head><body><div class="wrap"><h1>LightBridge Frame Scanner</h1><p id="loaded" class="status">Loading inventory…</p><div class="card"><button id="scanBtn" class="primary">📷 Open Camera Scanner</button><div id="readerWrap" class="hidden"><div id="reader"></div></div><p id="scanStatus" class="status">Tap the button once and choose Allow when iPhone asks for camera access.</p></div><div class="card"><div class="label">MANUAL BARCODE</div><div class="row"><input id="manual" inputmode="numeric" placeholder="Enter barcode"><button id="lookupBtn" class="secondary">Find</button></div></div><div id="result" class="card hidden"><div id="foundState" class="brand"></div><div id="brand" class="brand"></div><div id="model" class="big"></div><span id="type" class="pill"></span><span id="color" class="pill"></span><div class="grid"><div class="metric"><div class="label">UNIT PRICE</div><div id="cost" class="v"></div></div><div class="metric"><div class="label">MSRP</div><div id="msrp" class="v"></div></div><div class="metric"><div class="label">COUNT</div><div id="qty" class="v"></div></div></div><p id="formula" class="status"></p><button id="addBtn" class="primary">Add to Count</button></div><div class="card"><div class="big"><span id="totalScans">0</span> scans · <span id="uniqueScans">0</span> unique</div><div id="recent" class="status">No scans yet.</div><div class="toolbar"><button id="exportBtn" class="secondary">Export CSV</button><button id="clearBtn" class="danger">Clear</button></div></div></div><script>
const FILE='inventory.csv';let inv=new Map(),current=null,count=JSON.parse(localStorage.getItem('lb-source-rebuild-count')||'{}'),scanner=null,running=false;const $=x=>document.getElementById(x),clean=x=>String(x||'').replace(/\D/g,'');function parse(t){let R=[],r=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(q){if(c==='"'&&n==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f.replace(/\r$/,''));R.push(r);r=[];f=''}else f+=c}if(f||r.length){r.push(f);R.push(r)}return R}async function load(){let R=parse(await(await fetch(FILE+'?'+Date.now())).text()),h=R.shift().map(x=>x.replace(/^\uFEFF/,'').trim()),ix=n=>h.indexOf(n);for(let a of R){let b=clean(a[ix('Barcode Number')]);if(!b)continue;inv.set(b,{barcode:b,brand:a[ix('Brand')],model:a[ix('Model')],color:a[ix('Color')],type:a[ix('Type')],cost:+a[ix('Invoice Unit Price')],msrp:+a[ix('MSRP Price')]})}$('loaded').textContent=inv.size+' source-verified items loaded';render()}
function lookup(v,add=false){let b=clean(v),x=inv.get(b);current=x||null;$('manual').value=b;$('result').classList.remove('hidden');$('foundState').textContent=x?'✓ FOUND':'⚠ NOT FOUND';$('foundState').className='brand '+(x?'ok':'bad');$('brand').textContent=x?.brand||'';$('model').textContent=x?.model||'Barcode not in inventory';$('type').textContent=x?.type||'';$('color').textContent=x?.color||'';$('cost').textContent=x?'$'+x.cost.toFixed(2):'—';$('msrp').textContent=x?'$'+x.msrp.toFixed(2):'—';$('qty').textContent=x?(count[b]?.qty||0):0;$('formula').textContent=x?'$'+x.cost.toFixed(2)+' × '+(x.type==='Sunglasses'?'2.75':'3.00')+' = $'+x.msrp.toFixed(2):'Not added to count.';$('addBtn').disabled=!x;if(add&&x)add()}
function add(){if(!current)return;let b=current.barcode;if(!count[b])count[b]={...current,qty:0};count[b].qty++;localStorage.setItem('lb-source-rebuild-count',JSON.stringify(count));$('qty').textContent=count[b].qty;render()}
function render(){let E=Object.entries(count);$('totalScans').textContent=E.reduce((s,[,v])=>s+v.qty,0);$('uniqueScans').textContent=E.length;$('recent').innerHTML=E.length?E.slice(-6).reverse().map(([b,v])=>'<div style="padding:7px 0;border-top:1px solid #eee"><b>'+v.brand+' '+v.model+'</b> × '+v.qty+'<br>'+b+'</div>').join(''):'No scans yet.'}
async function startCamera(){if(running){try{await scanner.stop()}catch(e){}running=false;$('readerWrap').classList.add('hidden');$('scanBtn').textContent='📷 Open Camera Scanner';return}if(!window.isSecureContext){$('scanStatus').textContent='Camera requires HTTPS. Open the GitHub Pages link in Safari.';return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('scanStatus').textContent='Camera API unavailable in this browser. Open this page directly in Safari.';return}try{$('scanStatus').textContent='Requesting camera permission…';let test=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});test.getTracks().forEach(t=>t.stop());$('readerWrap').classList.remove('hidden');scanner=new Html5Qrcode('reader');let cams=await Html5Qrcode.getCameras(),back=cams.find(c=>/back|rear|environment/i.test(c.label))||cams[cams.length-1];if(!back)throw new Error('No camera found');await scanner.start(back.id,{fps:10,qrbox:{width:300,height:140},aspectRatio:1.777},d=>{let b=clean(d);lookup(b,true);$('scanStatus').textContent=inv.has(b)?'Scanned '+b+' — added.':'Scanned '+b+' — not in inventory.'},()=>{});running=true;$('scanBtn').textContent='Stop Camera';$('scanStatus').textContent='Camera open — hold barcode inside the box.'}catch(e){console.error(e);$('readerWrap').classList.add('hidden');$('scanStatus').textContent='Camera error: '+(e.name||'')+' '+(e.message||e)+'. In iPhone Settings → Safari → Camera, choose Allow, then reload.'}}
$('scanBtn').onclick=startCamera;$('lookupBtn').onclick=()=>lookup($('manual').value);$('manual').onkeydown=e=>{if(e.key==='Enter')lookup(e.target.value)};$('addBtn').onclick=add;$('clearBtn').onclick=()=>{if(confirm('Clear count?')){count={};localStorage.removeItem('lb-source-rebuild-count');render()}};$('exportBtn').onclick=()=>{let L=[['Barcode','Brand','Model','Color','Type','Unit Price','MSRP','Qty']];for(let[b,v]of Object.entries(count))L.push([b,v.brand,v.model,v.color,v.type,v.cost,v.msrp,v.qty]);let s=L.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='lightbridge_count.csv';a.click()};load();</script></body></html>
